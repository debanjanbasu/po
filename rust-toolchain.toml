[toolchain]
# gpui-ce 0.3.0 requires Rust >= 1.95; micro-ai (micro-engine) requires
# Rust >= 1.101, which is why the pinned toolchain is newer than the GPUI
# minimum. The pinned nightly matches the toolchain used to verify this
# workspace.
channel = "nightly-2026-11-01"
components = ["rustfmt", "clippy"]
