[workspace]
resolver = "3"
members = [
    "crates/po-core",
    "crates/po-ui",
    "crates/po-app",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(pf_rustc_nightly)'] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debanjanbasu/po"

[workspace.dependencies]
po-core = { path = "crates/po-core" }
po-ui = { path = "crates/po-ui" }

gpui = { package = "gpui-ce", version = "0.3.0" }
gpui-platform = { package = "gpui_ce_platform", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "process", "time"] }
tracing = "0.1"
similar = "2"
sha2 = "0.10"

# Optimized profiles, ported from the sibling `oo` project's battle-tested
# cargo configuration (adapted for a native-only, non-wasm app).
[profile.dev]
opt-level = 2
panic = "immediate-abort"

# Dependencies at O3 so a change to one crate does not recompile the world.
[profile.dev.package."*"]
opt-level = 3

# Build scripts and proc macros run on the host: keep them fast.
[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"
# NOTE: `trim-paths = "all"` (used by oo) is an unstable cargo feature on
# nightly-2026-09-15, so it is omitted here; `strip = "symbols"` already
# removes the bulk of path-bearing debug info.

[profile.release.build-override]
opt-level = 3

# Fix forward on the latest nightly: pathfinder_simd's `extern "C" llvm.*`
# shims trip a rustc ABI-check ICE on aarch64. The vendored copy swaps them
# for `core::arch::aarch64` intrinsics (same semantics).
[patch.crates-io]
pathfinder_simd = { path = "vendor/pathfinder_simd-0.5.6" }
