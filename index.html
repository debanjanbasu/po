<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0" />
        <title>oo</title>
        <!-- gpui appends one <canvas> to <body> and draws the window into it
             (WebGPU preferred, WebGL2 fallback). The pin reserves viewport
             space for the app's own chrome; `touch-action: none` hands touch
             gestures to the app like the old canvas did. -->
        <link data-trunk rel="rust" data-bin="po" data-bindgen-target="web" data-keep-debug />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #100c0a;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
                -webkit-user-select: none;
                user-select: none;
            }
        </style>
    </head>
    <body></body>
</html>
