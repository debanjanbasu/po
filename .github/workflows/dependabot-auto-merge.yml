name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge for the verified Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          jq -r --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" --arg repo "$REPO" \
            '.workflow_run.pull_requests[]?
              | select(.head.sha == $sha and .head.ref == $branch and .head.repo.full_name == $repo)
              | .number' "$GITHUB_EVENT_PATH" |
            while read -r pr_number; do
              if gh api "repos/$REPO/pulls/$pr_number" |
                jq -e --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" --arg repo "$REPO" \
                  '.user.login == "dependabot[bot]"
                    and .head.sha == $sha
                    and .head.ref == $branch
                    and .head.repo.full_name == $repo' >/dev/null
              then
                gh pr merge --auto --squash --repo "$REPO" "$pr_number"
              fi
            done
