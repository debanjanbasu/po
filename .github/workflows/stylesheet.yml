# Compiles the gitignored `assets/tailwind.css` that every `dx build` needs.
#
# `src/main.rs` embeds that file through `asset!`, and it is generated rather
# than tracked, so a fresh checkout has none and the build dies with "Path
# …/assets/tailwind.css not found". Two workflows need it — `quality.yml` for
# the Rust lint jobs, `e2e.yml` for the tandem builds — and each runs on its own
# runners, so neither can reuse the other's artifact; both call this instead.
#
# Reusable workflow (`workflow_call`) because the previous arrangement was two
# byte-identical copies: a correction to one would have been invisible until the
# other failed. The caller still owns the dependency — each job that downloads
# the artifact must declare `needs:` on the job that calls this.
name: Compile stylesheet

on:
  workflow_call:

permissions:
  contents: read

jobs:
  stylesheet:
    name: Compile locked stylesheet
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Compile the locked stylesheet
        run: |
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tailwindcss --input tailwind.css --output assets/tailwind.css --minify

      - name: Ensure stylesheet compilation did not rewrite tracked inputs
        run: git diff --exit-code

      - name: Upload compiled stylesheet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-tailwind-css
          path: assets/tailwind.css
          if-no-files-found: error
          retention-days: 1
