[workspace]
resolver = "3"
members = [
    "crates/po-core",
    "crates/po-ui",
    "crates/po-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debanjanbasu/po"

[workspace.dependencies]
po-core = { path = "crates/po-core" }
po-ui = { path = "crates/po-ui" }

gpui = { package = "gpui-ce", version = "0.3.0" }
gpui-platform = { package = "gpui_ce_platform", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "6"
similar = "2"

[profile.release]
lto = "thin"
codegen-units = 1
