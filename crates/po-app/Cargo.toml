[package]
name = "po-app"
description = "po — a native, chat-driven AI desktop harness built on gpui-ce and micro-ai."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "po"
path = "src/main.rs"

[dependencies]
po-core.workspace = true
po-ui.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
gpui-ce-elements = { package = "gpui_ce_elements", version = "0.3.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
# Mirrors po-core's local-engine so cfg blocks in po-app activate on macOS.
local-engine = ["po-core/local-engine"]
