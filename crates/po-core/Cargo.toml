[package]
name = "po-core"
description = "Platform-agnostic AI harness core for po: sessions, agent state machine, tools, commands, providers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
similar.workspace = true
sha2.workspace = true

# nano-ai is consumed directly from its GitHub repository, pinned to a
# specific commit so builds are reproducible. The upstream workspace is
# `publish = false`, so it is only reachable over git.
nano-engine = { git = "https://github.com/debanjanbasu/nano-ai.git", rev = "5aabab6d607a96dd49c0a5c976921fc30a63d57f", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# The local engine is Apple-Silicon only; po-app enables this feature only on
# macOS targets. Other platforms use the OpenAI-compatible remote provider.
local-engine = ["dep:nano-engine"]

[lints]
workspace = true
